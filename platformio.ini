; File cấu hình PlatformIO cho dự án giám sát nhiệt độ - độ ẩm
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Thư viện sẽ được PlatformIO tự tải về khi build lần đầu
lib_deps =
    blynkkk/Blynk @ ^1.3.2
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
